[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phobos-ai-security"
version = "0.3.1"
description = "Evidence-driven web and AI security testing framework"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phobos = "cli:main"

[tool.setuptools]
py-modules = [
    "ai",
    "ai_surface",
    "ai_testing",
    "assessment_engine",
    "cli",
    "config",
    "crawler",
    "evidence",
    "graph",
    "models",
    "nodes",
    "request_manager",
    "scope",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
