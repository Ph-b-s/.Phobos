[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phobos-ai-security"
version = "0.9.0"
description = "AI-assisted web security scanner for AI-enabled applications"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.62.0"]
desktop = ["pyside6==6.10.1", "pyinstaller>=6.22,<7", "playwright==1.62.0"]
dev = ["pytest>=8,<9"]

[project.scripts]
phobos = "cli:main"
phobos-desktop = "desktop_launcher:main"

[tool.setuptools]
py-modules = [
    "account_manager",
    "access_control_module",
    "advanced_web_modules",
    "ai",
    "ai_boundary_modules",
    "ai_security_modules",
    "ai_setup",
    "ai_surface",
    "ai_testing",
    "app_services",
    "assessment_engine",
    "auth_module",
    "browser_adapter",
    "browser_interaction",
    "cli",
    "config",
    "coverage_modules",
    "crawler",
    "cross_application",
    "cross_layer",
    "csrf_module",
    "desktop_app",
    "desktop_launcher",
    "evidence",
    "graph",
    "knowledge_store",
    "models",
    "module_adapters",
    "module_runner",
    "nodes",
    "nmap_runner",
    "nosql_module",
    "planner",
    "protocol_modules",
    "reporting",
    "request_manager",
    "scanner",
    "security_modules",
    "standard_modules",
    "summarizer",
    "surface_analysis_modules",
    "template_module",
    "web_analysis_modules",
    "web_surface",
    "workflow_engine",
]
