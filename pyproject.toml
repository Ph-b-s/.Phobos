[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phobos-ai-security"
version = "0.5.0"
description = "AI-assisted web security scanner for AI-enabled applications"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.62.0"]

[project.scripts]
phobos = "cli:main"

[tool.setuptools]
py-modules = [
    "ai",
    "ai_surface",
    "ai_testing",
    "assessment_engine",
    "browser_adapter",
    "cli",
    "config",
    "crawler",
    "cross_layer",
    "evidence",
    "graph",
    "knowledge_store",
    "models",
    "nodes",
    "nmap_runner",
    "request_manager",
    "scope",
    "security_modules",
    "web_surface",
]
